<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toko Baju - Detail Produk</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
        background: #f5f5f5;
      }
      .container {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #333;
      }
      .product-info {
        background: #f9f9f9;
        padding: 15px;
        border-radius: 5px;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        color: #333;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      #summary {
        margin-top: 20px;
        padding: 15px;
        background: #e7f3ff;
        border-left: 4px solid #007bff;
        border-radius: 4px;
        font-weight: bold;
        color: #333;
        min-height: 20px;
      }
      #unitList {
        margin-top: 15px;
        padding-left: 20px;
        background: #f0f0f0;
        padding: 15px;
        border-radius: 4px;
        list-style-type: none;
        padding-left: 0;
      }
      #unitList li {
        padding: 8px;
        background: white;
        margin-bottom: 8px;
        border-radius: 3px;
        border-left: 3px solid #28a745;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Toko Baju - Detail Produk 1</h1>

      <div class="product-info">
        <h3>Kaos Premium</h3>
        <p id="price" data-price="150000">Harga: <strong>Rp 150.000</strong></p>
        <p>Stok: S(5) | M(3) | L(0)</p>
      </div>

      <form id="productForm">
        <div class="form-group">
          <label for="variant">Pilih Ukuran:</label>
          <select id="variant" required>
            <option value="">-- Pilih Ukuran --</option>
            <option value="S">Small (S)</option>
            <option value="M">Medium (M)</option>
            <option value="L">Large (L)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="quantity">Jumlah:</label>
          <input type="number" id="quantity" min="1" value="1" required />
        </div>

        <button type="submit">Tambah ke Keranjang</button>
      </form>

      <!-- Area untuk menampilkan pesan atau error -->
      <div id="summary"></div>

      <!-- Area untuk menampilkan daftar unit -->
      <h4>Pesanan Anda:</h4>
      <ul id="unitList"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
